[project]
name = "erpnext_no_discount"
authors = [{ name = "Yasir Shaikh", email = "erp.yasirshaikh@gmail.com" }]
description = "Per-item 'No Discount Applicable' flag for ERPNext sales documents"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
